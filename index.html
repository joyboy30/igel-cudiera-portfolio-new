<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: without it every env(safe-area-inset-*) the phone
         shell pads with is 0. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Igel G. Cudiera | Full-Stack SEO &amp; Web Development</title>
    <meta name="description" content="Full-Stack SEO &amp; Web Development | GoHighLevel Funnels &amp; AI Automation. Technical, on-page and local SEO, WordPress builds and AI search optimization by Igel G. Cudiera, Cebu, Philippines." />
    <meta name="author" content="Igel G. Cudiera" />

    <!-- NOINDEX, by design. The portfolio is public but must not appear in
         search results. This meta tag is the in-page directive; vercel.json
         also sends the same rule as an `X-Robots-Tag` response header on every
         path. robots.txt deliberately does NOT disallow crawling - a crawler
         that is blocked from fetching the page never sees the noindex. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="googlebot" content="noindex, nofollow" />

    <!-- The browser bar takes the page colour (--cream per theme); the inline
         theme script below and lib/theme.ts keep it in step with the toggle.
         Literal hex here only because this runs before any stylesheet loads. -->
    <meta name="theme-color" content="#F4F4ED" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/images/avatar.webp" />

    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- The rail avatar is above the fold on every desktop route. Keep this in
         sync with profile.avatarSrc in src/data/profile.ts. -->
    <link rel="preload" as="image" href="/images/avatar.webp" fetchpriority="high" media="(min-width: 1100px)" />

    <!-- Open Graph / social share -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Igel G. Cudiera" />
    <meta property="og:title" content="Igel G. Cudiera | Full-Stack SEO &amp; Web Development" />
    <meta property="og:description" content="Technical, on-page and local SEO, WordPress web development, GoHighLevel funnels and AI automation. Available part-time, per project or on retainer." />
    <meta property="og:url" content="https://igel-cudiera-portfolio.vercel.app/" />
    <meta property="og:image" content="https://igel-cudiera-portfolio.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Igel G. Cudiera, Full-Stack SEO and Web Development" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Igel G. Cudiera | Full-Stack SEO &amp; Web Development" />
    <meta name="twitter:description" content="Technical, on-page and local SEO, WordPress web development, GoHighLevel funnels and AI automation." />
    <meta name="twitter:image" content="https://igel-cudiera-portfolio.vercel.app/og-image.jpg" />

    <!-- Structured data: who the site is about. Facts only, from the portfolio
         content; no ratings, prices or unverifiable claims. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Igel G. Cudiera",
        "jobTitle": "SEO Specialist and Web Developer",
        "url": "https://igel-cudiera-portfolio.vercel.app/",
        "image": "https://igel-cudiera-portfolio.vercel.app/images/igel-cudiera.webp",
        "email": "mailto:igel.cudiera31@gmail.com",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Medellin",
          "addressRegion": "Cebu",
          "addressCountry": "PH"
        },
        "alumniOf": { "@type": "CollegeOrUniversity", "name": "Cebu Normal University" },
        "knowsLanguage": ["English", "Tagalog", "Cebuano"],
        "knowsAbout": [
          "Search Engine Optimization",
          "Technical SEO",
          "On-Page SEO",
          "Local SEO",
          "AI Search Optimization",
          "WordPress"
        ],
        "sameAs": [
          "https://github.com/joyboy30",
          "https://www.linkedin.com/in/igelcudiera/"
        ]
      }
    </script>

    <!-- Theme before first paint: no flash of the wrong palette. Default is
         light; dark is the visitor's opt-in, persisted in localStorage. -->
    <script>
      (function () {
        try {
          document.documentElement.dataset.theme =
            localStorage.getItem('theme') === 'dark' ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
        if (document.documentElement.dataset.theme === 'dark') {
          var bar = document.querySelector('meta[name="theme-color"]');
          if (bar) bar.setAttribute('content', '#070B14');
        }
      })();
    </script>
  </head>
  <body>
    <noscript>
      <p style="font-family:sans-serif;padding:24px">
        Igel G. Cudiera, Full-Stack SEO &amp; Web Development. This portfolio needs JavaScript.
        Contact: igel.cudiera31@gmail.com
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
